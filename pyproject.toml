[project]
name = "minime"
version = "0.1.0"
description = "A tiny AI coding agent."
readme = "README.md"
authors = [
    { name = "Qazi Sami ur Rahman", email = "qsrahmans@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "httpx2>=2.12.0",
    "openai>=3.26.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[project.scripts]
minime = "minime.main:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Live tests call the real model configured in .env: uv run pytest -m live
addopts = "-m 'not live'"
markers = [
    "live: end-to-end tests against the real model configured in .env",
    "pty: runs the agent on a pseudo-terminal (POSIX only)",
]

[tool.ruff]
# So imports of the project's own modules sort as first-party.
src = ["src", "tests"]

[tool.ruff.lint]
# BLE and SIM are the rules the existing `# noqa` comments refer to; RUF100
# reports a `# noqa` that no longer suppresses anything.
select = ["E", "F", "I", "B", "UP", "SIM", "BLE", "RUF100"]
ignore = [
    "E501",   # line length is the formatter's job; long strings are allowed
    "SIM105", # try/except/pass reads better here than contextlib.suppress
]
