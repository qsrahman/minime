[project]
name = "minime"
version = "0.1.0"
description = "A tiny AI coding agent."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "httpx2>=2.12.0",
    "openai>=3.26.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The modules are flat files in the project root, not an installed package.
pythonpath = ["."]
